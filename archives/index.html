  <div class="photo-view" id="photo-view" hidden>
    <button class="close" type="button" aria-label="Close">&times;</button>
    <img alt="">
  </div>
  <script>
    (function () {
      var view = document.getElementById("photo-view");
      var full = view.querySelector("img");
      var close = view.querySelector(".close");
      function hide() {
        view.hidden = true;
        full.removeAttribute("src");
        document.body.style.overflow = "";
      }
      document.querySelector(".archives-grid").addEventListener("click", function (e) {
        var img = e.target.closest("img");
        if (!img) return;
        full.src = img.currentSrc || img.src;
        view.hidden = false;
        document.body.style.overflow = "hidden";
      });
      close.addEventListener("click", hide);
      view.addEventListener("click", function (e) {
        if (e.target === view) hide();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !view.hidden) hide();
      });
    })();
  </script>

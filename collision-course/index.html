<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collision course — Goulielmos Dermon</title>
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="preconnect" href="https://i.vimeocdn.com">
<link rel="preconnect" href="https://f.vimeocdn.com">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="sidebar">
    <a class="name" href="/">Goulielmos Dermon</a>
    <nav class="menu">
      <a href="/film/" class="active">FILM <span class="sub">/ collision course</span></a>
      <a href="/bio/">bio</a>
      <a href="/contact/">contact</a>
    </nav>
    <a class="next" href="/help-is-available/">play <span>&ldquo;help is available&rdquo;</span> &rarr;</a>
  </header>
  <main class="content filmpage">
    <h1>collision course</h1>
    <div class="stage">
    <div class="player">
      <img class="poster" src="/images/collision-course-1600.webp" srcset="/images/collision-course-800.webp 800w, /images/collision-course-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 70vw" fetchpriority="high" alt="">
      <iframe src="https://player.vimeo.com/video/945691757?controls=0&title=0&byline=0&portrait=0&dnt=1&h=ae618c0f2d" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
      <div class="hit"></div>
    </div>
    <div class="controls">
      <button class="pp">play</button>
      <div class="bar"><div class="fill"></div></div>
      <span class="time">0:00</span>
      <button class="fs" aria-label="Fullscreen"><span class="fs-label">fullscreen</span><svg class="fs-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="i-open" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="i-close" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
    </div>
    </div>
    <p class="desc">An mosaic of interrelated characters connected by a mysterious circumstance that happened earlier that day.</p>
  </main>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    const wrap=document.querySelector('.player'), btn=document.querySelector('.pp'),
          bar=document.querySelector('.bar'), fill=document.querySelector('.fill'),
          time=document.querySelector('.time');
    const player=new Vimeo.Player(wrap.querySelector('iframe'));
    let playing=false;
    const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
    function toggle(){
      if(playing){ player.pause(); return; }
      player.play().catch(()=>{ wrap.classList.add('on','native'); });
    }
    btn.addEventListener('click',toggle);
    wrap.querySelector('.hit').addEventListener('click',toggle);
    player.on('play',()=>{playing=true;btn.textContent='pause';wrap.classList.add('on');});
    player.on('pause',()=>{playing=false;btn.textContent='play';});
    player.on('ended',()=>{playing=false;btn.textContent='play';});
    player.on('timeupdate',d=>{fill.style.width=(d.percent*100)+'%';time.textContent=fmt(d.seconds)+' / '+fmt(d.duration);});
    bar.addEventListener('click',async e=>{
      const r=bar.getBoundingClientRect(), d=await player.getDuration();
      player.setCurrentTime(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*d);
    });
    const stage=document.querySelector('.stage'), fs=document.querySelector('.fs');
    fs.addEventListener('click',()=>{
      if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
      else if(stage.requestFullscreen){stage.requestFullscreen();}
      else if(stage.webkitRequestFullscreen){stage.webkitRequestFullscreen();}
      else{player.requestFullscreen();}
    });
    const fsChange=()=>{const on=!!(document.fullscreenElement||document.webkitFullscreenElement);fs.classList.toggle('is-on',on);fs.querySelector('.fs-label').textContent=on?'exit fullscreen':'fullscreen';};
    document.addEventListener('fullscreenchange',fsChange);
    document.addEventListener('webkitfullscreenchange',fsChange);
    document.addEventListener('keydown',e=>{if(e.key==='f')fs.click();});
    document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}});
  </script>
</body>
</html>

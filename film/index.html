<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film — Goulielmos Dermon</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="sidebar">
    <a class="name" href="/">Goulielmos Dermon</a>
    <nav class="menu">
      <a href="/film/" class="active">film</a>
      <a href="/archives/">archives</a>
      <a href="/bio/">bio</a>
      <a href="/contact/">contact</a>

  </header>
  <main class="content">
    <div class="film-index">
      <nav class="film-names">
        <a href="/day-out/" data-id="day-out" class="is-on">day out</a>
        <a href="/roses-cigarettes/" data-id="roses-cigarettes">roses &amp; cigarettes</a>
        <a href="/last-sunny-day/" data-id="last-sunny-day">last sunny day</a>

        <a href="/help-is-available/" data-id="help-is-available">help is available</a>
      </nav>
      <div class="film-preview">
        <a class="shot is-on" href="/day-out/" data-id="day-out">
          <img src="/images/day-out-grid-s-1600.webp" srcset="/images/day-out-grid-s-800.webp 800w, /images/day-out-grid-s-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 70vw" fetchpriority="high" decoding="async" alt="day out">
        </a>
        <a class="shot" href="/roses-cigarettes/" data-id="roses-cigarettes">
          <img src="/images/roses-cigarettes-1600.webp" srcset="/images/roses-cigarettes-800.webp 800w, /images/roses-cigarettes-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 70vw" decoding="async" alt="roses &amp; cigarettes">
        </a>
        <a class="shot" href="/last-sunny-day/" data-id="last-sunny-day">
          <img src="/images/last-sunny-day-1600.webp" srcset="/images/last-sunny-day-800.webp 800w, /images/last-sunny-day-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 70vw" decoding="async" alt="last sunny day">
        </a>
        <a class="shot" href="/collision-course/" data-id="collision-course">
          <img src="/images/collision-course-1600.webp" srcset="/images/collision-course-800.webp 800w, /images/collision-course-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 70vw" decoding="async" alt="collision course">
        </a>
        <a class="shot" href="/help-is-available/" data-id="help-is-available">
          <img src="/images/help-is-available-1600.webp" srcset="/images/help-is-available-800.webp 800w, /images/help-is-available-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 70vw" decoding="async" alt="help is available">
        </a>
      </div>
    </div>

    <div class="films">
      <a class="tile" href="/day-out/">
        <img src="/images/day-out-grid-s-1600.webp" srcset="/images/day-out-grid-s-800.webp 800w, /images/day-out-grid-s-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 35vw" fetchpriority="high" decoding="async" alt="day out" loading="lazy">
        <span class="title" data-film="day-out">day out</span>
      </a>
      <a class="tile" href="/roses-cigarettes/">
        <img src="/images/roses-cigarettes-1600.webp" srcset="/images/roses-cigarettes-800.webp 800w, /images/roses-cigarettes-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 35vw" decoding="async" alt="roses &amp; cigarettes" loading="lazy">
        <span class="title" data-film="roses-cigarettes">roses &amp; cigarettes</span>
      </a>
      <a class="tile" href="/last-sunny-day/">
        <img src="/images/last-sunny-day-1600.webp" srcset="/images/last-sunny-day-800.webp 800w, /images/last-sunny-day-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 35vw" loading="lazy" decoding="async" alt="last sunny day">
        <span class="title" data-film="last-sunny-day">last sunny day</span>
      </a>
      <a class="tile" href="/collision-course/">
        <img src="/images/collision-course-1600.webp" srcset="/images/collision-course-800.webp 800w, /images/collision-course-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 35vw" loading="lazy" decoding="async" alt="collision course">
        <span class="title" data-film="collision-course">collision course</span>
      </a>
      <a class="tile" href="/help-is-available/">
        <img src="/images/help-is-available-1600.webp" srcset="/images/help-is-available-800.webp 800w, /images/help-is-available-1600.webp 1600w" sizes="(max-width: 800px) 100vw, 35vw" loading="lazy" decoding="async" alt="help is available">
        <span class="title" data-film="help-is-available">help is available</span>
      </a>
    </div>
  </main>
  <script src="/watch-stats.js"></script>
  <script>
    (function () {
      var index = document.querySelector(".film-index");
      if (!index) return;
      var names = index.querySelectorAll(".film-names a");
      var shots = index.querySelectorAll(".shot");
      function show(id) {
        names.forEach(function (a) { a.classList.toggle("is-on", a.dataset.id === id); });
        shots.forEach(function (s) { s.classList.toggle("is-on", s.dataset.id === id); });
      }
      names.forEach(function (a) {
        a.addEventListener("mouseenter", function () { show(a.dataset.id); });
      });
      index.addEventListener("mouseleave", function () { show("day-out"); });
    })();
  </script>
</body>
</html>
